[project]
name = "ravi-hello"
version = "0.3.0"
description = "A simple hello module CLI app made with typer and enhanced with rich"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Violet-Quinn", email = "altarravik@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asciinema>=2.4.0",
    "rich>=14.1.0",
    "typer>=0.16.1",
]

[project.scripts]
ravi-hello = "ravi_hello:app"
ravi_hello = "ravi_hello:app"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
